<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="clc.css">
    <link rel="icon" href="OIP.jfif">
</head>
<body class="image">

  
    <div align="center" class="mainborder">
        <div align="center" >

            <div class="input">
                <input type="text" placeholder="0" id="input" readonly >
                <span class="blinker"></span>
            </div>


            <div class="button">
                <button class="button1" onclick="cleardisplay()">Ac</button>
                <button class="button1" onclick="appendValue('%')">%</button>
                <button class="button1" onclick="deletelast()">Del</button>
                <button class="button1" style="font-size: 50px;" onclick="appendValue('÷')">÷</button> 
                <button class="button1" onclick="appendValue('7')">7</button>
                <button class="button1" onclick="appendValue('8')">8</button>
                <button class="button1" onclick="appendValue('9')">9</button>
                <button class="button1" onclick="appendValue('X')">X</button>
                <button class="button1" onclick="appendValue('4')">4</button>
                <button class="button1" onclick="appendValue('5')">5</button>
                <button class="button1" onclick="appendValue('6')">6</button>
                <button class="button1"  style="font-size: 80px;" onclick="appendValue('-')" >-</button>
                <button class="button1" onclick="appendValue('1')">1</button>
                <button class="button1" onclick="appendValue('2')">2</button>
                <button class="button1" onclick="appendValue('3')">3</button>
                <button class="button1"style="font-size: 80px;" onclick="appendValue('+')">+</button>
                <button class="button1" onclick="appendValue('00')">00</button>
                <button class="button1" onclick="appendValue('0')">0</button>
                <button class="button1" onclick="appendValue('.')">.</button>
                <button class="button1" onclick="calculate()">=</button>

            </div>
        </div>
    </div>
<script src="clc.js"></script>

</body>
</html>
